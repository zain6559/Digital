services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: noor
      POSTGRES_PASSWORD: noor
      POSTGRES_DB: noor
    ports: ["5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U noor"]
      interval: 5s
      timeout: 5s
      retries: 20
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  qdrant:
    image: qdrant/qdrant:v1.11.0
    ports: ["6333:6333"]
    volumes: ["qdrant_data:/qdrant/storage"]
  backend:
    build: ./backend
    env_file: .env
    ports: ["8000:8000"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }
      qdrant: { condition: service_started }
    volumes:
      - ./mobile_bridge:/app/mobile_bridge
      - ./playwright_profiles:/app/playwright_profiles
  frontend:
    build: ./frontend
    env_file: .env
    ports: ["3000:3000"]
    depends_on: [backend]
volumes:
  postgres_data:
  qdrant_data:
